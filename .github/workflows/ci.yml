name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: npm test
      # grade-layer.mjs is left out: it reads Excalidraw's moving master branch.
      - name: Grade against the pinned answer keys
        working-directory: grading
        run: |
          npm ci
          node grade-rough.mjs
          node grade-freehand.mjs
